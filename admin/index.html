<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin Arsip Dakwah</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- ===========================
LOGIN
=========================== -->

<div id="loginPage">

<div class="login-box">

<h1>📚 Admin Arsip Dakwah</h1>

<p>Masukkan PIN Admin</p>

<input
type="password"
id="pin"
placeholder="PIN">

<button
id="loginBtn">

Masuk

</button>

<p
id="status">

</p>

</div>

</div>

<!-- ===========================
DASHBOARD
=========================== -->

<div
id="dashboard"
style="display:none;">

<div class="login-box">

<h1>📚 Dashboard Admin</h1>

<p>

Selamat Datang,
<b id="adminName"></b>

</p>

<div class="menu">

<button id="btnTambah">

🖼 Tambah Poster

</button>

<button id="btnArsip">

📂 Semua Arsip

</button>

<button id="btnStatistik">

📊 Statistik

</button>

<button id="btnSetting">

⚙ Pengaturan

</button>

<button id="logout">

🚪 Logout

</button>

</div>

</div>

</div>

<!-- ===========================
UPLOAD POSTER
=========================== -->

<div
id="uploadPage"
style="display:none;">

<div class="login-box">

<h1>

🖼 Tambah Poster

</h1>

<p>

Lengkapi data poster

</p>

<input
type="file"
id="posterFile"
accept="image/*">

<input
type="file"
id="pdfFile"
accept=".pdf">

<input
type="text"
id="judul"
placeholder="Judul Poster">

<select id="kategori">

<option>Tauhid</option>

<option>Sunnah</option>

<option>Bid'ah</option>

<option>Syirik</option>

<option>Khurafat</option>

<option>Aqidah</option>

<option>Fikih</option>

<option>Hadits</option>

<option>Tafsir</option>

<option>Akhlak</option>

<option>Muamalah</option>

<option>Tanya Jawab</option>

</select>

<input
type="text"
id="tag"
placeholder="Tag (pisahkan dengan koma)">

<textarea
id="caption"
placeholder="Caption Pendek"></textarea>

<textarea
id="content"
placeholder="Isi Caption Lengkap"></textarea>

<button
id="btnPreview">

👁 Preview

</button>

<button
id="btnSimpan">

🚀 Simpan Poster

</button>

<button
id="btnKembali">

⬅ Kembali ke Dashboard

</button>

</div>

</div>

<script src="config.js"></script>

<script src="login.js"></script>

<script src="app.js"></script>

</body>

  </html>
